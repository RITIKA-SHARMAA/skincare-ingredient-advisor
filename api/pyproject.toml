[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skincare-ingredient-advisor-api"
version = "0.2.0"
description = "FastAPI service for ingredient analysis, routine conflicts and Gemini-backed explanations."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "google-genai>=1.16,<2",
  "google-cloud-storage>=2.19,<4",
  "google-auth>=2.36,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "testcontainers[postgres]>=4.9,<5",
]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.gcp"]
# google-cloud-storage and google-auth ship without complete type hints.
disallow_untyped_calls = false
