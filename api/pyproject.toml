[project]
name = "skincare-ingredient-advisor-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "google-genai>=1.16,<2",
  "google-cloud-storage>=2.19,<3",
]
[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "httpx>=0.28,<1",
  "testcontainers[postgres]>=4.9,<5",
  "coverage>=7.6,<8",
]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2", "types-requests>=2.32,<3"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
