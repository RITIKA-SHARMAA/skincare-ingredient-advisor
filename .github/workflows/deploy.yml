name: Deploy
on:
  push: {branches: [main]}
permissions: {contents: read, id-token: write}
env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
      - run: docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/skincare/api:${GITHUB_SHA} api && docker push $REGION-docker.pkg.dev/$PROJECT_ID/skincare/api:${GITHUB_SHA}
      - run: docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/skincare/web:${GITHUB_SHA} web && docker push $REGION-docker.pkg.dev/$PROJECT_ID/skincare/web:${GITHUB_SHA}
      - run: gcloud run deploy skincare-api --image=$REGION-docker.pkg.dev/$PROJECT_ID/skincare/api:${GITHUB_SHA} --region=$REGION --project=$PROJECT_ID
      - run: gcloud run deploy skincare-web --image=$REGION-docker.pkg.dev/$PROJECT_ID/skincare/web:${GITHUB_SHA} --region=$REGION --project=$PROJECT_ID
