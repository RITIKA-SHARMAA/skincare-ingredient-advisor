name: Deploy to Cloud Run

# Manual only. Needs the infrastructure from infra/ and these repository variables:
# GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT, API_URL.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REPO: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/skincare
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push images
        run: |
          docker build -t "$REPO/api:$GITHUB_SHA" api
          docker build -t "$REPO/web:$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.API_URL }}" web
          docker push "$REPO/api:$GITHUB_SHA"
          docker push "$REPO/web:$GITHUB_SHA"

      - name: Run database migrations and seed
        run: |
          gcloud run jobs update skincare-migrate --image="$REPO/api:$GITHUB_SHA" \
            --region="$REGION" --project="$PROJECT_ID"
          gcloud run jobs execute skincare-migrate --wait --region="$REGION" --project="$PROJECT_ID"

      - name: Deploy services
        run: |
          gcloud run deploy skincare-api --image="$REPO/api:$GITHUB_SHA" \
            --region="$REGION" --project="$PROJECT_ID"
          gcloud run deploy skincare-web --image="$REPO/web:$GITHUB_SHA" \
            --region="$REGION" --project="$PROJECT_ID"
