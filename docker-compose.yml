services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skincare
      POSTGRES_USER: skincare
      POSTGRES_PASSWORD: skincare
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skincare -d skincare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://skincare:skincare@db:5432/skincare
      STORAGE_ROOT: /app/storage
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: ["./api:/app", "label_data:/app/storage"]
    user: root
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./web
      target: deps
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_INTERNAL_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["3000:3000"]
    depends_on: [api]
    volumes: ["./web:/app", "/app/node_modules", "/app/.next"]
    command: npm run dev

volumes:
  postgres_data:
  label_data:
